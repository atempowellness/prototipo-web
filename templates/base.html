{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}{{ titulo }}{% endblock %} | Atempo Wellness</title>
  <meta name="description" content="Atempo Wellness: estudio boutique de bienestar en San Isidro. Pilates, Yoga, Pesas y Zumba en grupos reducidos.">
  <script>
    /* Elige el tema antes de dibujar la página, para que no parpadee:
       el que la persona eligió con el botón o, si no eligió, el del dispositivo. */
    var tema = null;
    try { tema = localStorage.getItem('atempo-tema'); } catch (e) {}
    if (!tema) tema = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = tema;
  </script>
  <link rel="icon" type="image/svg+xml" href="{% static 'img/logo/atempo-icono.svg' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{% static 'css/atempo.css' %}?v={{ version_estaticos }}">
</head>
<body>
  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <div class="aviso-demo" role="note">
    Prototipo de demostración: los datos son de ejemplo y ningún pago es real.
  </div>

  {% include 'partes/encabezado.html' %}

  <main id="contenido">
    {% block contenido %}{% endblock %}
  </main>

  {% include 'partes/pie.html' %}

  <script src="{% static 'js/atempo.js' %}?v={{ version_estaticos }}"></script>
</body>
</html>
