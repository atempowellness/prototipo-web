{% with actual=request.resolver_match.url_name %}
<header class="encabezado">
  <div class="contenedor encabezado-fila">
    <a class="marca" href="{% url 'inicio' %}">{% include 'partes/logo.html' %}</a>

    <button class="boton-menu" type="button" aria-expanded="false" aria-controls="menu-principal">Menú</button>

    <nav class="menu" id="menu-principal" aria-label="Principal">
      <a href="{% url 'inicio' %}" {% if actual == 'inicio' %}aria-current="page"{% endif %}>Inicio</a>
      <a href="{% url 'horarios' %}" {% if actual == 'horarios' %}aria-current="page"{% endif %}>Clases y horarios</a>
      <a href="{% url 'paquetes' %}" {% if actual == 'paquetes' %}aria-current="page"{% endif %}>Paquetes</a>
      <a href="{% url 'bienestar' %}" {% if actual == 'bienestar' %}aria-current="page"{% endif %}>Nutrición y masajes</a>
      <a href="{% url 'comunidad' %}" {% if actual == 'comunidad' %}aria-current="page"{% endif %}>Comunidad</a>
      <a href="{% url 'nosotros' %}" {% if actual == 'nosotros' %}aria-current="page"{% endif %}>Nosotros</a>
    </nav>

    {% if user.is_authenticated %}
      <a class="boton boton-borde" href="{% url 'cuenta' %}">Mi cuenta</a>
    {% else %}
      <a class="boton boton-borde" href="{% url 'ingresar' %}{% if actual != 'ingresar' and actual != 'registro' and actual != 'recuperar' and actual != 'nueva_clave' %}?next={{ request.path|urlencode }}{% endif %}">Ingresar</a>
    {% endif %}
  </div>
</header>
{% endwith %}
